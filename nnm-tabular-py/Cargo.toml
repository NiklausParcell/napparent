[package]
name = "nnm-tabular-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for nnm-tabular-core (pyarrow)"

[lib]
name = "_nnm_tabular"
crate-type = ["cdylib", "rlib"]

[dependencies]
nnm-tabular-core = { path = "../nnm-tabular-core" }
arrow = { version = "58", default-features = true }
arrow-pyarrow = "58"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
