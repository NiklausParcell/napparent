[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "napparent-tabular"
version = "0.5.0"
description = "napparent tabular pipeline — make model features apparent (Rust, pyarrow)"
requires-python = ">=3.10"
dependencies = ["pyarrow>=15"]

[tool.maturin]
manifest-path = "napparent-tabular-py/Cargo.toml"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "napparent_tabular._napparent_tabular"
