[package]
name = "nnm-tabular-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NNM tabular preprocessing and Psychic Barnacle (Arrow + ndarray)"

[features]
default = []
parquet = ["dep:parquet", "dep:tokio"]

[dependencies]
arrow = { version = "58", default-features = true }
ndarray = "0.16"
parquet = { version = "58", default-features = false, features = ["arrow", "async"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
